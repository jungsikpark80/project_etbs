<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근조상품 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --accent: #2B3644;
    --bg: #F5F5F3;
    --surface: #FFFFFF;
    --text: #1F2329;
    --muted: #5C626B;
    --hint: #646A73;
    --line: #D5D6D2;
    --required: #B4412F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E9E9E6;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    position: sticky; top: 0; z-index: 1;
    height: 56px; flex-shrink: 0;
    display: flex; align-items: center;
    padding: 0 8px;
    background: var(--surface);
    border-bottom: 1px solid #E6E6E2;
  }
  header h1 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700; }
  .icon-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; cursor: pointer; color: var(--text);
  }
  .spacer { width: 44px; height: 44px; }
  main { flex: 1; display: flex; flex-direction: column; }
  .content { flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 28px; }
  .intro { display: flex; flex-direction: column; gap: 8px; }
  .intro .title { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; color: var(--accent); }
  .intro .desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
  form { margin: 0; display: flex; flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 14px; font-weight: 500; }
  .field label span { color: var(--required); }
  .field input {
    height: 52px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface);
    font-family: inherit; font-size: 16px; color: var(--text);
    -webkit-appearance: none; appearance: none;
    width: 100%;
  }
  .field input::placeholder { color: #8A9099; }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(43,54,68,0.12); }
  .field .help { margin: 0; font-size: 12px; line-height: 1.5; color: var(--hint); }
  .bottom {
    position: sticky; bottom: 0;
    padding: 12px 20px calc(28px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .btn {
    width: 100%; height: 56px;
    border: 0; border-radius: 12px;
    font-family: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer;
    background: var(--accent); color: #FFFFFF;
  }
  .btn:disabled { background: #D9DADC; color: #5F646C; cursor: default; }
  .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:focus-visible { outline: 3px solid rgba(43,54,68,0.35); outline-offset: 2px; }
  .done {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 28px; gap: 16px; text-align: center;
  }
  .done .badge {
    width: 64px; height: 64px; border-radius: 32px; background: #E8EAEC;
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .done .title { margin: 0; font-size: 20px; font-weight: 700; }
  .done .desc { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button type="button" class="icon-btn" aria-label="뒤로 가기" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>근조상품 신청</h1>
    <div class="spacer"></div>
  </header>

  <!-- 신청 화면 -->
  <main id="form-view">
    <div class="content">
      <div class="intro">
        <p class="title">삼가 고인의 명복을 빕니다</p>
        <p class="desc">아래 정보를 입력하시면 담당자가 확인 후 연락드립니다.</p>
      </div>

      <form id="apply-form" novalidate>
        <div class="field">
          <label for="f-name">이름 <span>*</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" placeholder="신청자 이름을 입력해 주세요" required>
        </div>
        <div class="field">
          <label for="f-phone">연락처 <span>*</span></label>
          <input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13" required>
        </div>
        <div class="field">
          <label for="f-date">근조일자 <span>*</span></label>
          <input id="f-date" name="date" type="date" required>
          <p class="help">근조상품이 필요한 날짜를 선택해 주세요.</p>
        </div>
      </form>
    </div>

    <div class="bottom">
      <button type="submit" form="apply-form" class="btn" id="submit-btn" disabled>신청하기</button>
    </div>
  </main>

  <!-- 완료 화면 -->
  <main id="done-view" hidden>
    <div class="done">
      <div class="badge">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <p class="title">신청이 접수되었습니다</p>
      <p class="desc"><span id="done-name"></span> 님, 담당자가 확인 후<br><span id="done-phone"></span> 으로 연락드리겠습니다.</p>
    </div>
    <div class="bottom">
      <button type="button" class="btn secondary" id="reset-btn">확인</button>
    </div>
  </main>
</div>

<script>
  (function () {
    var form = document.getElementById('apply-form');
    var nameEl = document.getElementById('f-name');
    var phoneEl = document.getElementById('f-phone');
    var dateEl = document.getElementById('f-date');
    var submitBtn = document.getElementById('submit-btn');
    var formView = document.getElementById('form-view');
    var doneView = document.getElementById('done-view');

    function formatPhone(v) {
      var d = String(v || '').replace(/\D/g, '').slice(0, 11);
      if (d.length < 4) return d;
      if (d.length < 8) return d.slice(0, 3) + '-' + d.slice(3);
      return d.slice(0, 3) + '-' + d.slice(3, d.length - 4) + '-' + d.slice(d.length - 4);
    }

    function isReady() {
      return nameEl.value.trim() !== '' &&
        phoneEl.value.replace(/\D/g, '').length >= 10 &&
        dateEl.value !== '';
    }

    function update() { submitBtn.disabled = !isReady(); }

    phoneEl.addEventListener('input', function () {
      phoneEl.value = formatPhone(phoneEl.value);
      update();
    });
    nameEl.addEventListener('input', update);
    dateEl.addEventListener('input', update);
    dateEl.addEventListener('change', update);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!isReady()) return;
      document.getElementById('done-name').textContent = nameEl.value.trim();
      document.getElementById('done-phone').textContent = phoneEl.value;
      formView.hidden = true;
      doneView.hidden = false;
      window.scrollTo(0, 0);
    });

    document.getElementById('reset-btn').addEventListener('click', function () {
      form.reset();
      update();
      doneView.hidden = true;
      formView.hidden = false;
    });
  })();
</script>
</body>
</html>
